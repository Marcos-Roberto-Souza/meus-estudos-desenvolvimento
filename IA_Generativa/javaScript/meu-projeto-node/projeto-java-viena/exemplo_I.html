<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title> Exemplo 1 </title>
</head>

<body>
    <script type="text/javascript">
        var divisao = function(num1, num2){
            if(num2 != "0"){
                var resultado = num1/num2;
                alert("O resultado da divisão é: " + resultado);
            }else{
                alert("Não é possível fazer divisão por Zero!");
            }
        };

        divisao(10, 0);

    </script>
</body>

</html>
