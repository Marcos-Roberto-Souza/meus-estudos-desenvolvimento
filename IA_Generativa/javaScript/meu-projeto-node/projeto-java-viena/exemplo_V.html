<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        var x = Number.MAX_VALUE,
            y = Number.MIN_VALUE,
            z = Number.POSITIVE_INFINITY,
            w = Number.NEGATIVE_INFINITY,
            a = Number.NaN;
            
        document.write("O valor máximo do tipo Number é: " + x + "<br>");
        document.write("O valor mínimo do tipo Number é: " + y + "<br>");
        document.write("O valor de infinito positivo do tipo Number é: " + z + "<br>");
        document.write("O valor de infinito negativo do tipo Number é: " + w + "<br>");
        document.write("O valor de NaN do tipo Number é: " + a);

    </script>
</body>
</html>
