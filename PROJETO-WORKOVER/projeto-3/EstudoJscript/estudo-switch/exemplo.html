<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo do switch</title>
</head>

<body>
    <label for="clima">Selecione o tipo de clima hoje: </label>
    <select id="clima">
        <option value=""> -- Escolha um -- </option>
        <option value="ensolarado">Ensolarado</option>
        <option value="chuvoso">Chuvoso</option>
        <option value="nevando">Nevando</option>
        <option value="nublado">Nublado</option>
    </select>

    <p></p>

    <script>
        const select = document.querySelector('select');
        const para = document.querySelector('p');// este vai pegar o resultado e por no <p></p> que esta abaixo do select 
        select.onchange = setClima;

        function setClima() {
            const escolha = select.value;

            switch (escolha) {
                case 'ensolarado':
                    para.textContent = 'Hoje está um dia muito bonito! Ponha um boné. ';
                    break;
                case 'chuvoso':
                    para.textContent = 'A chuva está caindo lá fora.. Não deixe de levar um guarda-chuva';
                    break;
                case 'nevando':
                    para.textContent = 'A neve está caindo - está congelando! não saia de casa até passar a tempestade';
                    break;
                case 'nublado':
                    para.textContent = 'Não está chovendo, mas o céu está cinzento é bom se previnir';
                    break;
                default:
                    para.textContent = '';

            }
        }
    </script>

</body>

</html>
