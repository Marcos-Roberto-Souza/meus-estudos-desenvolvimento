<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de JavaScript</title>
</head>

<body>
    <script>
        const numero = prompt("Digite um numero: ");
        if (numero >= 0) {
            if (numero % 2 == 0) {
                alert("Este nuemro: " + numero + " é positivo mas é Par.");
            } else {
                alert("Este numero: " + numero + " é Positivo mas é Impar. ");
            }
        } else {
            if (numero % 2 == 0) {
                alert("este numero: " + numero + " é Negativo e é Par. ");
            } else {
                alert("este numero: " + numero + " é Negativo e é Impar. ");
            }
        }
    </script>

</body>

</html>
