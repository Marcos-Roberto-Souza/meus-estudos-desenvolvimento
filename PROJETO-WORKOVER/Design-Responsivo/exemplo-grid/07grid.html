<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        /* Padronizar as Colunas */

        [class*="col-"]{
            float: left;
            border: 1px solid red;
            box-sizing: border-box;
            padding: 10px;
        }


        /* Colunas */

        .col-1 {width: 8.33%;}
        .col-2 {width: 16.66%;}
        .col-3 {width: 25%;}
        .col-4 {width: 33.33%;}
        .col-5 {width: 41.66%;}
        .col-6 {width: 50%;}
        .col-7 {width: 58.33%;}
        .col-8 {width: 66.66%;}
        .col-9 {width: 75%;}
        .col-10 {width: 83.33%;}
        .col-11 {width: 91.33%;}
        .col-12 {width: 100%;}

    </style>


</head>
<body>

    <div class="col-4">Primeira Coluna 33.33%</div>
    <div class="col-4">Segunda Coluna 33.33%</div>
    <div class="col-4">Terceira Coluna 33.33%</div>
    <div class="col-6">Quarta Coluna 50%</div>
    <div class="col-6">Quinta Coluna 50%</div>
    <div class="col-12">Sexta Coluna 100%</div>


    
</body>
</html>
