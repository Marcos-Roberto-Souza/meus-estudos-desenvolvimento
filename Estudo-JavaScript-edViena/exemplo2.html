<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2</title>

</head>

<body>
    <script type="text/javascript">
        // Seu código JavaScript aqui
        var v = 10 + 10,
            x = 10 - 5,
            y = 10 * 2,
            z = 10 / 2;
        a = 7;



        if ((a > 5) && (a < 10)) {
            document.write("<br><br> O valor de " + a + " é maior que 5 e menor que 10. <br>");
        }
        if (!(a == 5)) {
            document.write(" O valor de " + a + " não é igual a 5. <br>");
        }

        document.write("O resultado de 10 + 10 é: " + v + "<br>");
        document.write("O resultado de 10 - 5 é: " + x + "<br>");
        document.write("O resultado de 10 * 2 é: " + y + "<br>");
        document.write("O resultado de 10 / 2 é: " + z + "<br>");


    </script>
</body>

</html>
