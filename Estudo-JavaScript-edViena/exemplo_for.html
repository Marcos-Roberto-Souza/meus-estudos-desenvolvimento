<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <script type="text/javascript">
        var seuNome = prompt("Digite seu nome:");

        for (var x = 0; x < seuNome.length; x++) {
            document.write(seuNome[x] + "<br>");
        }

        for (var i = 10; i >= 0; i--) {
            document.write(i + "<br>");
        }

    </script>

</body>

</html>
