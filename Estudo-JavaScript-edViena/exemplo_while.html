<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo While</title>


</head>

<body>
    <script type="text/javascript">
        var contador = 0;
        while (contador < 10) {
            document.write("Contador: " + contador + "<br>");
            contador++;
        }
    </script>
</body>

</html>
